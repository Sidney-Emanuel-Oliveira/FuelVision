spring.application.name=fuelvision-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fuelvision}?sslmode=${POSTGRES_SSLMODE:prefer}}
spring.datasource.username=${POSTGRES_USER:fuelvision_app}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

fuelvision.prediction.base-url=${FUELVISION_PREDICTION_URL:${PREDICTION_URL:http://localhost:8000}}
fuelvision.prediction.tls.ca-bundle=${SSL_CERT_FILE:}
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=${FUELVISION_PREDICTION_READ_TIMEOUT:20s}

server.error.include-message=never
server.error.include-stacktrace=never
