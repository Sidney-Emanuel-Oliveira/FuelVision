spring.application.name=fuelvision-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fuelvision}?sslmode=${POSTGRES_SSLMODE:prefer}}
spring.datasource.username=${POSTGRES_USER:fuelvision_app}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.error.include-message=never
server.error.include-stacktrace=never
