services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina POSTGRES_ADMIN_PASSWORD}
      FUELVISION_DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    restart: unless-stopped

  prediction:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  gateway:
    image: caddy:2.11.4-alpine
    environment:
      FUELVISION_DOMAIN: ${FUELVISION_DOMAIN:?Defina FUELVISION_DOMAIN}
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "${FUELVISION_HTTP_PORT:-80}:80"
      - "${FUELVISION_HTTPS_PORT:-443}:443"
      - "${FUELVISION_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - fuelvision_caddy_data:/data
      - fuelvision_caddy_config:/config
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:2019/healthz || exit 1
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  fuelvision_caddy_data:
  fuelvision_caddy_config:
