name: Qualidade

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Testes, builds e contêineres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_ADMIN_PASSWORD: fuelvision_ci_admin
      POSTGRES_PASSWORD: fuelvision_ci_app
      FUELVISION_DOCKER_POSTGRES_PORT: "5433"
      FUELVISION_ENV_FILE: .env.ci

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ml/requirements-dev.txt

      - name: Instalar dependências Python
        run: python -m pip install -r ml/requirements-dev.txt

      - name: Verificar lint e formatação Python
        run: |
          python -m ruff check exploration pipeline ml tests
          python -m ruff check --config ml/pyproject.toml ml tests/test_ml_baseline.py tests/test_ml_serving.py
          python -m ruff format --check exploration pipeline ml tests

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do Front-end
        run: npm ci --prefix frontend

      - name: Criar configuração efêmera de integração
        run: |
          printf '%s\n' \
            'POSTGRES_HOST=localhost' \
            'POSTGRES_PORT=5433' \
            'POSTGRES_DB=fuelvision' \
            'POSTGRES_USER=fuelvision_app' \
            'POSTGRES_PASSWORD=fuelvision_ci_app' \
            'POSTGRES_SSLMODE=disable' \
            'POSTGRES_BIN=' \
            'FUELVISION_PREDICTION_URL=http://localhost:8000' \
            > .env.ci

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client shellcheck

      - name: Verificar scripts Bash
        run: shellcheck --external-sources --source-path=SCRIPTDIR backend/scripts/*.sh database/scripts/*.sh database/docker/*.sh scripts/*.sh

      - name: Validar a configuração do Compose
        run: docker compose config --quiet

      - name: Iniciar PostgreSQL de integração
        run: docker compose up --detach --build --wait postgres

      - name: Executar testes Python com PostgreSQL
        env:
          FUELVISION_RUN_DB_TESTS: "1"
        run: python -m unittest discover -s tests -v

      - name: Executar testes Java com PostgreSQL
        run: backend/scripts/test.sh --with-postgres

      - name: Executar qualidade e testes do Front-end
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend run format:check
          npm --prefix frontend test

      - name: Executar builds locais
        run: |
          mvn -f backend/pom.xml package -DskipTests
          npm --prefix frontend run build

      - name: Construir todos os contêineres
        run: docker compose build

      - name: Iniciar a aplicação completa
        run: docker compose up --detach --wait

      - name: Executar testes de fumaça
        run: |
          curl --fail --silent --show-error http://localhost:5173/ > /dev/null
          curl --fail --silent --show-error http://localhost:5173/api/prices/summary > /dev/null
          curl --fail --silent --show-error http://localhost:5173/api/predictions/model > /dev/null

      - name: Exibir diagnóstico em caso de falha
        if: failure()
        run: docker compose ps && docker compose logs --no-color

      - name: Encerrar os contêineres
        if: always()
        run: docker compose down --volumes --remove-orphans
